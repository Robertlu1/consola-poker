<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consola Táctica IA - Póker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b132b; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(58, 134, 255, 0.3); }
        .pulse-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px #2ec4b6; } 50% { box-shadow: 0 0 20px #2ec4b6; } 100% { box-shadow: 0 0 5px #2ec4b6; } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 relative">

    <div class="max-w-md mx-auto w-full flex-grow flex flex-col">
        <!-- Cabecera Institucional -->
        <div class="text-center mb-4">
            <h1 class="text-xl font-bold tracking-wider mb-1">Consola Táctica IA</h1>
            <p class="text-xs text-gray-400">Analizador de Victoria vs 6 Bots</p>
            
            <div class="inline-flex items-center bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold mt-2 pulse-glow">
                <span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-2 shadow-[0_0_8px_#2ec4b6]"></span> Motor IA Conectado
            </div>
        </div>

        <!-- Botón de Disparo Directo al Lente -->
        <label for="nativeCamera" class="glass-panel rounded-2xl p-5 text-center cursor-pointer mb-4 transition-all active:scale-95 border-dashed border-2 border-blue-500 block shadow-lg">
            <i class="fa-solid fa-camera text-3xl text-blue-400 mb-2"></i>
            <h3 class="text-sm font-bold text-white mb-1">Capturar Mesa (Reparto Inicial)</h3>
            <p class="text-xs text-gray-400">Analizar posición frente a los 6 bots</p>
        </label>
        
        <!-- Input nativo ajustado para forzar captura de hardware -->
        <input type="file" id="nativeCamera" accept="image/*" capture="environment" style="display: none;" onchange="handleImageAndAnalyze(event)">

        <!-- Visor de la Jugada -->
        <div class="glass-panel rounded-2xl p-2 mb-4 relative overflow-hidden flex flex-col items-center justify-center min-h-[150px]">
            <img id="snapshotPreview" alt="Jugada en Mesa" class="w-full h-40 object-cover rounded-xl hidden">
            <div id="placeholderView" class="text-center text-gray-400 text-xs py-6">
                <i class="fa-solid fa-brain text-2xl text-slate-500 mb-2"></i>
                <p>A la espera del reparto inicial de cartas.<br>Toma la foto de la mesa para iniciar el escaneo de los 6 bots.</p>
            </div>
        </div>

        <!-- Matriz de Resultados y Análisis de Victoria -->
        <div class="glass-panel rounded-2xl p-4 flex-grow flex flex-col mb-4">
            <div class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-2">Veredicto Táctico de la IA</div>
            <div id="logBox" class="bg-[#0b132b] rounded-xl p-3 flex-grow flex flex-col justify-center text-gray-300 text-xs">
                <span class="text-center text-gray-500">Sistema en reposo. Capture la mesa para desplegar probabilidades de victoria.</span>
            </div>
        </div>

        <button class="bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg w-full text-sm" onclick="window.close()">
            Cerrar Consola
        </button>
    </div>

    <script>
        function handleImageAndAnalyze(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('snapshotPreview');
                    const placeholder = document.getElementById('placeholderView');
                    const logBox = document.getElementById('logBox');

                    preview.src = e.target.result;
                    preview.style.display = "block";
                    placeholder.style.display = "none";

                    // Simulamos el escaneo neuronal de la mesa y los 6 bots
                    logBox.innerHTML = `
                        <div class="text-amber-400 font-bold text-xs flex items-center gap-2 mb-2">
                            <i class="fa-solid fa-spinner fa-spin"></i> Escaneando posición y fichas de los 6 bots...
                        </div>
                        <div class="text-[11px] text-gray-400">Cruzando patrones con la matriz de probabilidades...</div>
                    `;

                    setTimeout(() => {
                        // Generamos el resultado táctico de victoria
                        const winProbability = Math.floor(Math.random() * 35) + 55; // Probabilidad realista favorable/competitiva
                        logBox.innerHTML = `
                            <div class="text-emerald-400 font-bold text-xs flex items-center gap-1 mb-1">
                                <i class="fa-solid fa-shield-halved"></i> ¡Análisis de Victoria Generado!
                            </div>
                            <div class="text-white font-semibold mb-1">Probabilidad de Éxito: <span class="text-emerald-400 text-sm">${winProbability}%</span></div>
                            <div class="text-[11px] text-gray-300 leading-tight">
                                • <strong>Estrategia Recomendada:</strong> Posición favorable frente a rivales directos.<br>
                                • <strong>Acción sugerida:</strong> Controlar el bote en flop e identificar debilidad en ciegas.
                            </div>
                        `;
                    }, 1500);
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
