<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consola Táctica IA - Póker</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
        }

        /* Selector de Idioma flotante */
        .lang-selector {
            position: absolute;
            top: 0;
            right: 0;
            background: #1c2541;
            border: 1px solid #3a86ff;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: #8d99ae;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 255, 128, 0.1);
            border: 1px solid rgba(0, 255, 128, 0.3);
            color: #2ec4b6;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-badge span {
            width: 8px;
            height: 8px;
            background-color: #2ec4b6;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px #2ec4b6;
        }

        /* Tarjeta de captura rápida */
        .capture-card {
            background: linear-gradient(135deg, #1c2541 0%, #0b132b 100%);
            border: 2px dashed #3a86ff;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .capture-card:active {
            transform: scale(0.98);
            border-color: #4ea8de;
        }

        .capture-card i {
            font-size: 2.5rem;
            color: #4ea8de;
            margin-bottom: 10px;
        }

        .capture-card h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .capture-card p {
            font-size: 0.75rem;
            color: #8d99ae;
        }

        /* Registro de análisis */
        .log-section {
            background-color: #1c2541;
            border-radius: 16px;
            padding: 15px;
            flex-grow: 1;
            border: 1px solid #334155;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .log-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8d99ae;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .log-content {
            background-color: #0b132b;
            border-radius: 10px;
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #8d99ae;
            font-size: 0.85rem;
            min-height: 120px;
        }

        .log-content img {
            max-width: 100%;
            max-height: 140px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        /* Botón inferior */
        .btn-close {
            background: linear-gradient(135deg, #3a86ff 0%, #2563eb 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3);
            text-align: center;
        }

        .btn-close:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Selector de Idioma -->
        <select id="langSelect" class="lang-selector" onchange="changeLanguage()">
            <option value="es">🇪🇸 ES</option>
            <option value="en">🇬🇧 EN</option>
        </select>

        <h1 id="txtTitle">Consola Táctica IA</h1>
        <p id="txtSubtitle">Analizador Privado de Póker</p>
        <div class="status-badge" id="txtStatus">
            <span></span> PC Conectada y en Escucha
        </div>
    </div>

    <!-- Disparador rápido de cámara/galería -->
    <div class="capture-card" onclick="document.getElementById('cameraInput').click();">
        <i class="fa-solid fa-camera-retro"></i>
        <h3 id="txtCamTitle">Toca aquí para abrir la cámara</h3>
        <p id="txtCamSub">Toma la foto de la mesa o mano actual</p>
    </div>
    
    <input type="file" id="cameraInput" accept="image/*" style="display: none;">

    <div class="log-section">
        <div class="log-title" id="txtLogTitle">Registro de Análisis</div>
        <div class="log-content" id="logBox">
            <i class="fa-solid fa-brain" style="font-size: 2rem; color: #334155; margin-bottom: 8px;"></i>
            <span id="txtWaiting">Esperando captura de pantalla...<br>Sube una imagen para activar el trabajo unísono de las 6 IAs.</span>
        </div>
    </div>

    <button class="btn-close" id="btnClose" onclick="window.close()">Cerrar Consola</button>

    <script>
        const texts = {
            es: {
                title: "Consola Táctica IA",
                subtitle: "Analizador Privado de Póker",
                status: "PC Conectada y en Escucha",
                camTitle: "Toca aquí para abrir la cámara",
                camSub: "Toma la foto de la mesa o mano actual",
                logTitle: "Registro de Análisis",
                waiting: "Esperando captura de pantalla...<br>Sube una imagen para activar el trabajo unísono de las 6 IAs.",
                analyzing: "Analizando jugada con las 6 IAs...",
                resultReady: "¡Veredicto Táctico Generado!",
                close: "Cerrar Consola"
            },
            en: {
                title: "AI Tactical Console",
                subtitle: "Private Poker Analyzer",
                status: "PC Connected & Listening",
                camTitle: "Tap here to open camera",
                camSub: "Take a photo of the current table or hand",
                logTitle: "Analysis Log",
                waiting: "Waiting for screenshot...<br>Upload an image to trigger the 6 AIs joint analysis.",
                analyzing: "Analyzing play with the 6 AIs...",
                resultReady: "Tactical Verdict Ready!",
                close: "Close Console"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('txtTitle').innerText = texts[lang].title;
            document.getElementById('txtSubtitle').innerText = texts[lang].subtitle;
            document.getElementById('txtStatus').innerHTML = `<span></span> ${texts[lang].status}`;
            document.getElementById('txtCamTitle').innerText = texts[lang].camTitle;
            document.getElementById('txtCamSub').innerText = texts[lang].camSub;
            document.getElementById('txtLogTitle').innerText = texts[lang].logTitle;
            
            const logBox = document.getElementById('logBox');
            if(logBox.dataset.state === "waiting" || !logBox.dataset.state) {
                logBox.innerHTML = `<i class="fa-solid fa-brain" style="font-size: 2rem; color: #334155; margin-bottom: 8px;"></i> ${texts[lang].waiting}`;
            }
            document.getElementById('btnClose').innerText = texts[lang].close;
        }

        const cameraInput = document.getElementById('cameraInput');
        const logBox = document.getElementById('logBox');

        cameraInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            const currentLang = document.getElementById('langSelect').value;
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logBox.dataset.state = "analyzing";
                    // Fase 1: Respuesta visual inmediata y fluida
                    logBox.innerHTML = `
                        <img src="${e.target.result}" alt="Captured Hand">
                        <div style="color: #2ec4b6; font-weight: bold; margin-top: 5px;">
                            <i class="fa-solid fa-spinner fa-spin"></i> ${texts[currentLang].analyzing}
                        </div>
                    `;

                    // Fase 2: Simulación rápida y objetiva de respuesta táctica en tiempo récord (1.2 segundos)
                    setTimeout(() => {
                        logBox.innerHTML = `
                            <img src="${e.target.result}" alt="Captured Hand">
                            <div style="color: #2ec4b6; font-weight: bold; margin-top: 4px; font-size: 0.8rem;">
                                <i class="fa-solid fa-check-circle"></i> ${texts[currentLang].resultReady}
                            </div>
                            <div style="font-size: 0.78rem; margin-top: 6px; color: #f8fafc; text-align: left; background: #162038; padding: 8px; border-radius: 6px; border-left: 3px solid #2ec4b6;">
                                <strong>Acción Óptima:</strong> Valor esperado positivo. Alta probabilidad de éxito en river.
                            </div>
                        `;
                    }, 1200);
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
