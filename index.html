<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consola Táctica IA - Póker</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b132b; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(58, 134, 255, 0.3); }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 relative">

    <div class="max-w-md mx-auto w-full flex-grow flex flex-col fade-in">
        <!-- Cabecera -->
        <div class="text-center mb-4 relative">
            <!-- Selector de Idioma Flotante -->
            <select id="langSelect" class="absolute top-0 right-0 bg-[#1c2541] border border-blue-500 text-white px-2 py-1 rounded-lg text-xs outline-none cursor-pointer" onchange="changeLanguage()">
                <option value="es">🇪🇸 ES</option>
                <option value="en">🇬🇧 EN</option>
            </select>

            <h1 id="txtTitle" class="text-xl font-bold tracking-wider mb-1">Consola Táctica IA</h1>
            <p id="txtSubtitle" class="text-xs text-gray-400">Analizador Privado de Póker</p>
            
            <div class="inline-flex items-center bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold mt-2" id="txtStatus">
                <span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-2 shadow-[0_0_8px_#2ec4b6]"></span> PC Conectada y en Escucha
            </div>
        </div>

        <!-- Tarjeta de captura directa con cámara trasera -->
        <label for="cameraInput" class="glass-panel rounded-2xl p-5 text-center cursor-pointer mb-4 transition-all duration-300 active:scale-95 border-dashed border-2 border-blue-500 block">
            <i class="fa-solid fa-camera-retro text-3xl text-blue-400 mb-2"></i>
            <h3 id="txtCamTitle" class="text-sm font-bold text-white mb-1">Toca aquí para abrir la cámara</h3>
            <p id="txtCamSub" class="text-xs text-gray-400">Toma la foto de la mesa o mano actual</p>
        </label>
        
        <!-- Input con capture="environment" para abrir la cámara trasera del dispositivo móvil -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

        <!-- Registro de Análisis / Visor -->
        <div class="glass-panel rounded-2xl p-4 flex-grow flex flex-col mb-4">
            <div id="txtLogTitle" class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-3">Registro de Análisis</div>
            <div id="logBox" class="bg-[#0b132b] rounded-xl p-4 flex-grow flex flex-col items-center justify-center text-center text-gray-400 text-xs min-h-[140px]">
                <i class="fa-solid fa-brain text-2xl text-slate-600 mb-2"></i>
                <span id="txtWaiting">Esperando captura de pantalla...<br>Sube una imagen para activar el análisis unísono.</span>
            </div>
        </div>

        <!-- Botón inferior para cerrar o salir -->
        <button id="btnClose" class="bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg w-full text-sm transition active:opacity-90" onclick="window.close()">
            Cerrar Consola
        </button>
    </div>

    <script>
        const texts = {
            es: {
                title: "Consola Táctica IA",
                subtitle: "Analizador Privado de Póker",
                status: "PC Conectada y en Escucha",
                camTitle: "Toca aquí para abrir la cámara",
                camSub: "Toma la foto de la mesa o mano actual",
                logTitle: "Registro de Análisis",
                waiting: "Esperando captura de pantalla...<br>Sube una imagen para activar el análisis unísono.",
                analyzing: "Procesando captura con las IAs..."
            },
            en: {
                title: "AI Tactical Console",
                subtitle: "Private Poker Analyzer",
                status: "PC Connected & Listening",
                camTitle: "Tap here to open camera",
                camSub: "Take a photo of the current table or hand",
                logTitle: "Analysis Log",
                waiting: "Waiting for screenshot...<br>Upload an image to trigger the joint analysis.",
                analyzing: "Processing capture with AIs..."
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('txtTitle').innerText = texts[lang].title;
            document.getElementById('txtSubtitle').innerText = texts[lang].subtitle;
            document.getElementById('txtStatus').innerHTML = `<span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-2 shadow-[0_0_8px_#2ec4b6]"></span> ${texts[lang].status}`;
            document.getElementById('txtCamTitle').innerText = texts[lang].camTitle;
            document.getElementById('txtCamSub').innerText = texts[lang].camSub;
            document.getElementById('txtLogTitle').innerText = texts[lang].logTitle;
            
            const logBox = document.getElementById('logBox');
            if(logBox.dataset.state !== "processing") {
                logBox.innerHTML = `<i class="fa-solid fa-brain text-2xl text-slate-600 mb-2"></i> <span id="txtWaiting">${texts[lang].waiting}</span>`;
            }
            document.getElementById('btnClose').innerText = (lang === 'es') ? "Cerrar Consola" : "Close Console";
        }

        const cameraInput = document.getElementById('cameraInput');
        const logBox = document.getElementById('logBox');

        cameraInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            const currentLang = document.getElementById('langSelect').value;
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logBox.dataset.state = "processing";
                    logBox.innerHTML = `
                        <img src="${e.target.result}" alt="Captured Hand" class="max-w-full max-h-36 rounded-lg mb-2 object-contain">
                        <div class="text-emerald-400 font-bold mt-1 text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-spinner fa-spin"></i> ${texts[currentLang].analyzing}
                        </div>
                    `;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
