<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón de Clases - CONFENACAPV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 relative">

    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col fade-in">
        <!-- Cabecera de la Clase -->
        <div class="text-center mb-6 mt-4">
            <img src="assets/img/logo-confenacapv.png" alt="Logo CONFENACAPV" class="w-24 h-auto mx-auto mb-3 object-contain bg-white p-2 rounded-xl shadow-lg" onerror="this.src='assets/img/logo.png'">
            <h1 class="text-2xl font-bold tracking-wider">Salón de Clases CONFENACAPV</h1>
            <p id="nombreSalaTexto" class="text-indigo-400 text-sm font-semibold mt-1">Sala Oficial de Capacitación</p>
        </div>

        <!-- Panel de Control y Reglas de la Sala -->
        <div class="glass-panel rounded-xl p-4 mb-6 text-xs text-gray-300 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <span id="rolUsuarioTexto" class="font-semibold text-indigo-400 block mb-1">Normas de la Sala:</span>
                <p>• Micrófonos silenciados al entrar.<br>• Use la función de levantar la mano para pedir la palabra en orden parlamentario.</p>
            </div>
            <a href="app.html" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition-colors text-center">
                Volver a la App
            </a>
        </div>

        <!-- Contenedor del Botón de Videollamada -->
        <div class="glass-panel rounded-xl overflow-hidden shadow-2xl flex-grow flex flex-col min-h-[500px] relative border border-indigo-500/30">
            <div id="meet" class="w-full h-full flex flex-col items-center justify-center p-6 text-center absolute inset-0">
                <!-- El contenido se inyectará por JavaScript -->
            </div>
        </div>
    </div>

    <!-- Script de integración Jitsi Meet forzado a App Externa -->
    <script>
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoSala = urlParams.get('sala') || 'ConfenacapvSalaGeneralOficial';
            const claveModerador = urlParams.get('mod');
            
            // Definimos la clave secreta institucional para los profesores
            const CLAVE_SECRETA_PROFESOR = "proffe2026*";
            const esProfesor = (claveModerador === CLAVE_SECRETA_PROFESOR);

            // Actualizamos textos en pantalla según el rol
            if (esProfesor) {
                document.getElementById('nombreSalaTexto').innerText = "Sala: " + codigoSala.toUpperCase() + " [MODO INSTRUCTOR]";
                document.getElementById('rolUsuarioTexto').innerText = "Panel de Control del Instructor:";
                document.getElementById('rolUsuarioTexto').className = "font-semibold text-green-400 block mb-1";
            } else {
                document.getElementById('nombreSalaTexto').innerText = "Sala: " + codigoSala.toUpperCase();
            }

            const roomName = "Confenacapv_" + codigoSala.replace(/[^a-zA-Z0-9_-]/g, '');
            
            // Construimos el enlace Android Intent para forzar la apertura externa
            const intentUrl = `intent://meet.jit.si/${roomName}#Intent;scheme=https;end`;

            // Inyectamos el botón de acceso
            const meetContainer = document.getElementById('meet');
            meetContainer.innerHTML = `
                <div class="bg-indigo-900/40 text-indigo-200 p-4 rounded-lg mb-8 max-w-md border border-indigo-500/30">
                    <p class="font-bold mb-2 text-white">¡Sala Lista!</p>
                    <p class="text-sm">Para garantizar el funcionamiento de su micrófono y cámara, la videollamada se abrirá en la aplicación externa.</p>
                </div>
                
                <a href="${intentUrl}" class="bg-[#2468FF] hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-xl shadow-[0_0_20px_rgba(36,104,255,0.4)] transform transition hover:-translate-y-1 hover:scale-105 mb-4 text-lg w-full max-w-xs flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    Unirse a la Clase
                </a>
                
                <p class="text-xs text-gray-400 max-w-xs mt-4">Si Jitsi Meet no está instalado, se abrirá en su navegador web predeterminado (Chrome).</p>
            `;
        };
    </script>
</body>
</html>
