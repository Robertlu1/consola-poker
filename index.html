<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consola Táctica IA - Póker</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b132b; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(58, 134, 255, 0.3); }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 relative">

    <div class="max-w-md mx-auto w-full flex-grow flex flex-col fade-in">
        <!-- Cabecera -->
        <div class="text-center mb-4 relative">
            <select id="langSelect" class="absolute top-0 right-0 bg-[#1c2541] border border-blue-500 text-white px-2 py-1 rounded-lg text-xs outline-none cursor-pointer" onchange="changeLanguage()">
                <option value="es">🇪🇸 ES</option>
                <option value="en">🇬🇧 EN</option>
            </select>

            <h1 id="txtTitle" class="text-xl font-bold tracking-wider mb-1">Consola Táctica IA</h1>
            <p id="txtSubtitle" class="text-xs text-gray-400">Analizador Privado de Póker</p>
            
            <div class="inline-flex items-center bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold mt-2" id="txtStatus">
                <span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-2 shadow-[0_0_8px_#2ec4b6]"></span> Cámara en Vivo Activa
            </div>
        </div>

        <!-- Botón para disparar la cámara por hardware real -->
        <div onclick="startCamera()" class="glass-panel rounded-2xl p-4 text-center cursor-pointer mb-3 transition-all duration-300 active:scale-95 border-dashed border-2 border-blue-500">
            <i class="fa-solid fa-camera text-3xl text-blue-400 mb-1"></i>
            <h3 id="txtCamTitle" class="text-sm font-bold text-white">Encender Cámara Trasera</h3>
            <p id="txtCamSub" class="text-xs text-gray-400">Acceso directo al lente sin galería</p>
        </div>

        <!-- Contenedor del Stream de Cámara Real y Captura -->
        <div class="glass-panel rounded-2xl p-3 mb-3 relative overflow-hidden flex flex-col items-center justify-center min-h-[180px]">
            <video id="videoElement" autoplay playsinline class="w-full h-44 object-cover rounded-xl bg-black hidden"></video>
            <canvas id="canvasElement" style="display: none;"></canvas>
            <img id="snapshotPreview" alt="Captura de Mesa" class="w-full h-44 object-cover rounded-xl hidden">
            
            <button id="captureBtn" onclick="takeSnapshot()" class="hidden mt-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-xl text-xs w-full shadow-lg transition">
                <i class="fa-solid fa-camera-retro mr-1"></i> Capturar y Analizar Mesa
            </button>
        </div>

        <!-- Registro de Análisis -->
        <div class="glass-panel rounded-2xl p-4 flex-grow flex flex-col mb-3">
            <div id="txtLogTitle" class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-2">Registro de Análisis</div>
            <div id="logBox" class="bg-[#0b132b] rounded-xl p-3 flex-grow flex flex-col items-center justify-center text-center text-gray-400 text-xs min-h-[100px]">
                <i class="fa-solid fa-brain text-2xl text-slate-600 mb-2"></i>
                <span id="txtWaiting">Esperando activación de cámara...<br>Pulsa el botón superior para iniciar el flujo.</span>
            </div>
        </div>

        <button id="btnClose" class="bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg w-full text-sm transition active:opacity-90" onclick="window.close()">
            Cerrar Consola
        </button>
    </div>

    <script>
        const texts = {
            es: {
                title: "Consola Táctica IA",
                subtitle: "Analizador Privado de Póker",
                status: "Cámara en Vivo Activa",
                camTitle: "Encender Cámara Trasera",
                camSub: "Acceso directo al lente sin galería",
                logTitle: "Registro de Análisis",
                waiting: "Esperando activación de cámara...<br>Pulsa el botón superior para iniciar el flujo.",
                analyzing: "Analizando jugada en tiempo real..."
            },
            en: {
                title: "AI Tactical Console",
                subtitle: "Private Poker Analyzer",
                status: "Live Camera Active",
                camTitle: "Turn on Rear Camera",
                camSub: "Direct lens access without gallery",
                logTitle: "Analysis Log",
                waiting: "Waiting for camera activation...<br>Tap the button above to start stream.",
                analyzing: "Analyzing play in real-time..."
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('txtTitle').innerText = texts[lang].title;
            document.getElementById('txtSubtitle').innerText = texts[lang].subtitle;
            document.getElementById('txtStatus').innerHTML = `<span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-2 shadow-[0_0_8px_#2ec4b6]"></span> ${texts[lang].status}`;
            document.getElementById('txtCamTitle').innerText = texts[lang].camTitle;
            document.getElementById('txtCamSub').innerText = texts[lang].camSub;
            document.getElementById('txtLogTitle').innerText = texts[lang].logTitle;
            
            const logBox = document.getElementById('logBox');
            if(logBox.dataset.state !== "processing") {
                logBox.innerHTML = `<i class="fa-solid fa-brain text-2xl text-slate-600 mb-2"></i> <span>${texts[lang].waiting}</span>`;
            }
            document.getElementById('btnClose').innerText = (lang === 'es') ? "Cerrar Consola" : "Close Console";
        }

        let mediaStream = null;
        const videoElement = document.getElementById('videoElement');
        const snapshotPreview = document.getElementById('snapshotPreview');
        const captureBtn = document.getElementById('captureBtn');
        const canvasElement = document.getElementById('canvasElement');
        const logBox = document.getElementById('logBox');

        async function startCamera() {
            try {
                // Forzar explícitamente la cámara trasera (environment) por hardware web
                const constraints = {
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                };
                
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    // Si el dispositivo no soporta 'exact: environment', intentamos con un selector genérico trasero
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                }

                videoElement.srcObject = mediaStream;
                videoElement.style.display = "block";
                snapshotPreview.style.display = "none";
                captureBtn.style.display = "block";

                logBox.innerHTML = `<span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-dot text-red-500 animate-pulse"></i> Lente trasero encendido. Enfoca la mesa y presiona capturar.</span>`;
            } catch (error) {
                alert("No se pudo acceder directamente a la cámara. Revisa los permisos del navegador en Telegram.");
            }
        }

        function takeSnapshot() {
            if (!mediaStream) return;

            const context = canvasElement.getContext('2d');
            canvasElement.width = videoElement.videoWidth || 1280;
            canvasElement.height = videoElement.videoHeight || 720;
            context.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

            const imageDataURL = canvasElement.toDataURL('image/png');
            
            // Apagar la cámara tras la captura para ahorrar recursos
            mediaStream.getTracks().forEach(track => track.stop());
            videoElement.style.display = "none";
            captureBtn.style.display = "none";

            snapshotPreview.src = imageDataURL;
            snapshotPreview.style.display = "block";

            const currentLang = document.getElementById('langSelect').value;
            logBox.dataset.state = "processing";
            logBox.innerHTML = `
                <div class="text-emerald-400 font-bold text-xs flex items-center justify-center gap-2 mb-1">
                    <i class="fa-solid fa-spinner fa-spin"></i> ${texts[currentLang].analyzing}
                </div>
                <div class="text-[11px] text-gray-300 bg-[#162038] p-2 rounded-lg border-l-2 border-emerald-400 text-left">
                    <strong>Estado:</strong> Fotograma capturado por hardware directo. Preparando matriz táctica.
                </div>
            `;
        }
    </script>
</body>
</html>
