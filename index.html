<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consola Táctica IA - Póker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b132b; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(58, 134, 255, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 relative">

    <div class="max-w-md mx-auto w-full flex-grow flex flex-col">
        <!-- Cabecera -->
        <div class="text-center mb-4 relative">
            <h1 class="text-xl font-bold tracking-wider mb-1">Consola Táctica IA</h1>
            <p class="text-xs text-gray-400">Analizador Privado de Póker</p>
            
            <div class="inline-flex items-center bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold mt-2">
                <span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-2 shadow-[0_0_8px_#2ec4b6]"></span> Canal Seguro Activo
            </div>
        </div>

        <!-- Botón Único de Disparo Directo a Cámara -->
        <label for="nativeCamera" class="glass-panel rounded-2xl p-6 text-center cursor-pointer mb-4 transition-all active:scale-95 border-dashed border-2 border-blue-500 block shadow-lg">
            <i class="fa-solid fa-camera text-4xl text-blue-400 mb-2"></i>
            <h3 class="text-sm font-bold text-white mb-1">Abrir Cámara y Capturar Mesa</h3>
            <p class="text-xs text-gray-400">Acceso directo al lente por hardware</p>
        </label>
        
        <!-- Input nativo forzado estrictamente a la cámara trasera -->
        <input type="file" id="nativeCamera" accept="image/*" capture="environment" style="display: none;" onchange="handleImage(event)">

        <!-- Visor de la Captura Real -->
        <div class="glass-panel rounded-2xl p-3 mb-4 relative overflow-hidden flex flex-col items-center justify-center min-h-[180px]">
            <img id="snapshotPreview" alt="Captura de Mesa" class="w-full h-48 object-cover rounded-xl hidden">
            <div id="placeholderView" class="text-center text-gray-400 text-xs py-6">
                <i class="fa-solid fa-image text-3xl text-slate-600 mb-2"></i>
                <p>Presiona el botón superior para activar la cámara del dispositivo y capturar la jugada.</p>
            </div>
        </div>

        <!-- Registro de Análisis -->
        <div class="glass-panel rounded-2xl p-4 flex-grow flex flex-col mb-4">
            <div class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-2">Registro de Análisis</div>
            <div id="logBox" class="bg-[#0b132b] rounded-xl p-3 flex-grow flex flex-col items-center justify-center text-center text-gray-400 text-xs">
                <span>Esperando captura de la mesa...</span>
            </div>
        </div>

        <button class="bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg w-full text-sm" onclick="window.close()">
            Cerrar Consola
        </button>
    </div>

    <script>
        function handleImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('snapshotPreview').src = e.target.result;
                    document.getElementById('snapshotPreview').style.display = "block";
                    document.getElementById('placeholderView').style.display = "none";
                    document.getElementById('logBox').innerHTML = `
                        <div class="text-emerald-400 font-bold text-xs flex items-center justify-center gap-2 mb-1">
                            <i class="fa-solid fa-circle-check"></i> Fotograma capturado con éxito
                        </div>
                        <div class="text-[11px] text-gray-300">Matriz táctica cargada y lista para análisis.</div>
                    `;
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
